name: Publish unified LilyPond CI image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - licenses/**
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lilypond-ci-image-release
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, smoke-test, publish GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build locally for pre-publication verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.name }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test complete PDF, MIDI and audio toolchain
        shell: bash
        run: |
          docker run --rm ${{ steps.image.outputs.name }}:ci-test ci-image-smoke-test

      - name: Publish immutable revision and convenience tags
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:2.26.0
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha

      - name: Print copyable digest for downstream workflows
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "### Verified GHCR image" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this immutable reference in score workflows:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The package may need Public visibility enabled once in GHCR." >> "$GITHUB_STEP_SUMMARY"
